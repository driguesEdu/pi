<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Cadastro - FitSocial</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;

            font-family: Arial, sans-serif;

            background: #0f3f58;

            display: flex;
            justify-content: center;
            align-items: center;

            min-height: 100vh;
        }


        .container {
            width: 850px;
            height: 520px;

            display: flex;

            background: white;

            border-radius: 10px;

            overflow: hidden;
        }


        /* =========================
           LADO ESQUERDO
        ========================= */

        .esquerda {
            width: 42%;

            background: #60bcee;

            position: relative;

            overflow: hidden;

            display: flex;

            align-items: center;
            justify-content: center;
        }


        .forma1 {
            position: absolute;

            width: 330px;
            height: 330px;

            background: #16587B;

            transform: rotate(45deg);

            left: -190px;
            top: 70px;
        }


        .forma2 {
            position: absolute;

            width: 280px;
            height: 280px;

            background: #3890c0;

            transform: rotate(45deg);

            left: -120px;
            top: -120px;
        }


        .forma3 {
            position: absolute;

            width: 250px;
            height: 250px;

            background: #16587B;

            transform: rotate(45deg);

            left: -130px;
            bottom: -130px;
        }


        .texto-esquerda {
            position: relative;

            z-index: 2;

            color: white;

            text-align: center;
        }


        .texto-esquerda h1 {
            font-size: 25px;

            margin-bottom: 10px;
        }


        .texto-esquerda p {
            font-size: 13px;
        }


        /* =========================
           LADO DIREITO
        ========================= */

        .direita {
            width: 58%;

            padding: 45px 55px;

            display: flex;

            flex-direction: column;

            align-items: center;
        }


        h2 {
            color: #16587B;

            font-size: 20px;

            margin: 0 0 30px;
        }


        .formulario {
            width: 100%;
        }


        .campo {
            display: flex;

            align-items: center;

            border-bottom: 1px solid #aaa;

            margin-bottom: 18px;
        }


        .campo span {
            color: #888;

            margin-right: 10px;

            font-size: 16px;
        }


        .campo input {
            width: 100%;

            border: none;

            outline: none;

            padding: 10px 0;

            font-size: 13px;
        }


        .erro {
            color: #d00000;

            font-size: 12px;

            margin-top: -10px;

            margin-bottom: 12px;

            min-height: 15px;
        }


        button {
            width: 100%;

            border: none;

            border-radius: 20px;

            padding: 11px;

            background: #16587B;

            color: white;

            font-weight: bold;

            cursor: pointer;

            margin-top: 5px;
        }


        button:hover {
            background: #124b69;
        }


        .voltar {
            margin-top: 18px;

            font-size: 12px;

            color: #16587B;

            text-decoration: none;
        }


        /* =========================
           RESPONSIVO
        ========================= */

        @media (max-width: 700px) {

            body {
                padding: 20px;
            }


            .container {
                width: 100%;

                height: auto;

                min-height: 520px;
            }


            .esquerda {
                display: none;
            }


            .direita {
                width: 100%;

                padding: 40px 30px;
            }

        }

    </style>

</head>


<body>


    <div class="container">


        <!-- =========================
             LADO ESQUERDO
        ========================= -->

        <div class="esquerda">

            <div class="forma1"></div>

            <div class="forma2"></div>

            <div class="forma3"></div>


            <div class="texto-esquerda">

                <h1>
                    FIT SOCIAL
                </h1>

                <p>
                    Crie sua conta e comece agora!
                </p>

            </div>

        </div>



        <!-- =========================
             LADO DIREITO
        ========================= -->

        <div class="direita">


            <h2>
                CRIAR CONTA
            </h2>


            <div class="formulario">


                <!-- NOME -->

                <div class="campo">

                    <span>👤</span>

                    <input
                        id="nome"
                        type="text"
                        placeholder="Nome de usuário"
                        autocomplete="name"
                    >

                </div>



                <!-- EMAIL -->

                <div class="campo">

                    <span>✉</span>

                    <input
                        id="email"
                        type="email"
                        placeholder="E-mail"
                        autocomplete="email"
                    >

                </div>



                <!-- SENHA -->

                <div class="campo">

                    <span>🔒</span>

                    <input
                        id="senha"
                        type="password"
                        placeholder="Senha"
                        autocomplete="new-password"
                    >

                </div>



                <!-- CONFIRMAR SENHA -->

                <div class="campo">

                    <span>🔒</span>

                    <input
                        id="confirmar"
                        type="password"
                        placeholder="Confirmar senha"
                        autocomplete="new-password"
                    >

                </div>



                <!-- MENSAGEM DE ERRO -->

                <div
                    class="erro"
                    id="erro"
                ></div>



                <!-- CADASTRAR -->

                <button onclick="cadastrar()">

                    CADASTRAR

                </button>


            </div>



            <a
                href="login.html"
                class="voltar"
            >
                Já tenho uma conta
            </a>


        </div>

    </div>



    <script>


        /* =========================
           FUNÇÃO DE CADASTRO
        ========================= */

        function cadastrar() {


            const nome =
                document
                    .getElementById("nome")
                    .value
                    .trim();


            const email =
                document
                    .getElementById("email")
                    .value
                    .trim()
                    .toLowerCase();


            const senha =
                document
                    .getElementById("senha")
                    .value;


            const confirmar =
                document
                    .getElementById("confirmar")
                    .value;


            const erro =
                document
                    .getElementById("erro");


            erro.innerText = "";



            /* =========================
               VALIDAR CAMPOS
            ========================= */

            if (
                !nome ||
                !email ||
                !senha ||
                !confirmar
            ) {

                erro.innerText =
                    "Preencha todos os campos!";

                return;
            }



            /* =========================
               VALIDAR EMAIL
            ========================= */

            if (!email.includes("@")) {

                erro.innerText =
                    "O e-mail precisa ter o @!";

                return;
            }


            if (!email.includes(".")) {

                erro.innerText =
                    "O e-mail precisa ter um ponto (.)!";

                return;
            }



            /* =========================
               VALIDAR SENHA
            ========================= */

            if (senha.length < 4) {

                erro.innerText =
                    "Senha muito curta! Use pelo menos 4 caracteres.";

                return;
            }


            if (senha !== confirmar) {

                erro.innerText =
                    "As senhas não coincidem!";

                return;
            }



            /* =========================
               PEGAR USUÁRIOS EXISTENTES
            ========================= */

            let usuarios = [];


            try {

                usuarios =
                    JSON.parse(
                        localStorage.getItem(
                            "fitSocialUsuarios"
                        )
                    ) || [];

            } catch (e) {

                usuarios = [];

            }



            /* =========================
               VERIFICAR EMAIL EXISTENTE
            ========================= */

            const usuarioExistente =
                usuarios.find(
                    usuario =>
                        usuario.email === email
                );


            if (usuarioExistente) {

                erro.innerText =
                    "Este e-mail já está cadastrado!";

                return;
            }



            /* =========================
               CRIAR NOVO USUÁRIO
            ========================= */

            const usuario = {

                id: Date.now(),

                nome: nome,

                email: email,

                senha: senha,

                fotoPerfil: "",

                seguidores: [],

                seguindo: [],

                dataCadastro:
                    new Date().toISOString()

            };



            /* =========================
               SALVAR USUÁRIO
            ========================= */

            usuarios.push(usuario);


            localStorage.setItem(

                "fitSocialUsuarios",

                JSON.stringify(usuarios)

            );



            /* =========================
               DEFINIR USUÁRIO LOGADO
            ========================= */

            sessionStorage.setItem(

                "usuario",

                JSON.stringify(usuario)

            );



            /* =========================
               MENSAGEM
            ========================= */

            alert(
                "Conta criada com sucesso!"
            );



            /* =========================
               IR PARA O PERFIL
            ========================= */

            window.location.href =
                "perfil.html";

        }


    </script>

</body>

</html>
