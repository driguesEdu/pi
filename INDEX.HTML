<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>FitSocial</title>

    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
        rel="stylesheet"
    >

    <style>

        /* =========================================
           CONFIGURAÇÕES GERAIS
        ========================================= */

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', sans-serif;
        }

        html,
        body {
            width: 100%;
            min-height: 100%;
        }

        body {
            background: #eef7f8;
            color: #123b43;

            display: flex;
            justify-content: center;
            align-items: center;

            min-height: 100vh;
        }


        /* =========================================
           TELA DO APLICATIVO
        ========================================= */

        .app {
            width: 390px;
            height: 844px;

            max-width: 100vw;
            max-height: 100vh;

            background: #eef7f8;

            overflow: hidden;

            position: relative;

            display: flex;
            flex-direction: column;
        }


        /* =========================================
           ÁREA PRINCIPAL
        ========================================= */

        .conteudo {
            width: 100%;
            height: 100%;

            overflow-y: auto;
            overflow-x: hidden;

            padding: 18px 14px 85px;

            scrollbar-width: none;
        }

        .conteudo::-webkit-scrollbar {
            display: none;
        }

        .feed {
            width: 100%;
        }


        /* =========================================
           TOPO
        ========================================= */

        .topo {
            display: flex;
            align-items: center;
            justify-content: space-between;

            margin-bottom: 18px;

            padding: 4px 4px 0;
        }

        .logo {
            font-size: 25px;
            font-weight: 700;

            color: #123b43;
        }

        .logo span {
            color: #12606b;
        }

        .topo-acoes {
            display: flex;
            gap: 15px;

            font-size: 22px;
        }

        .topo-acoes span {
            cursor: pointer;
        }


        /* =========================================
           CABEÇALHO
        ========================================= */

        .cabecalho {
            margin-bottom: 17px;
        }

        .cabecalho h1 {
            font-size: 24px;
            color: #123b43;

            margin-bottom: 5px;
        }

        .cabecalho p {
            font-size: 12px;
            color: #71878c;
        }


        /* =========================================
           POST
        ========================================= */

        .post {
            background: white;

            margin-bottom: 16px;

            border-radius: 18px;

            border: 1px solid #d8e6e8;

            padding: 13px;

            box-shadow:
                0 3px 12px rgba(0, 0, 0, 0.07);
        }


        /* =========================================
           CABEÇALHO DO POST
        ========================================= */

        .post-header {
            display: flex;
            align-items: center;

            margin-bottom: 11px;
        }

        .avatar {
            width: 42px;
            height: 42px;

            border-radius: 50%;

            background: #12606b;

            color: white;

            display: flex;
            align-items: center;
            justify-content: center;

            margin-right: 10px;

            font-weight: 600;

            overflow: hidden;

            flex-shrink: 0;

            border: 2px solid #f29ca4;
        }

        .avatar img {
            width: 100%;
            height: 100%;

            object-fit: cover;
        }

        .name {
            font-weight: 600;

            font-size: 13px;

            color: #123b43;
        }

        .time {
            font-size: 10px;

            color: #8a9da1;

            margin-top: 3px;
        }

        .seguir {
            margin-left: auto;

            color: #12606b;

            font-size: 11px;

            font-weight: 600;

            cursor: pointer;
        }


        /* =========================================
           TEXTO DO POST
        ========================================= */

        .post-text {
            margin: 8px 0 12px;

            line-height: 1.5;

            font-size: 13px;

            color: #34555c;
        }


        /* =========================================
           IMAGEM DO POST
        ========================================= */

        .post img.post-imagem {
            width: 100%;

            max-height: 500px;

            object-fit: cover;

            border-radius: 13px;

            display: block;
        }


        /* =========================================
           LOCALIZAÇÃO
        ========================================= */

        .localizacao {
            margin-top: 9px;

            font-size: 10px;

            color: #71878c;
        }


        /* =========================================
           ATIVIDADE
        ========================================= */

        .atividade {
            background: #eef7f8;

            border-radius: 13px;

            padding: 12px;

            margin-top: 8px;

            border: 1px solid #d8e6e8;
        }

        .atividade-titulo {
            font-size: 14px;

            font-weight: 700;

            color: #123b43;

            margin-bottom: 10px;
        }

        .atividade-dados {
            display: grid;

            grid-template-columns:
                repeat(3, 1fr);

            gap: 6px;
        }

        .atividade-dado {
            background: white;

            border-radius: 9px;

            padding: 8px 4px;

            text-align: center;
        }

        .atividade-dado strong {
            display: block;

            font-size: 14px;

            color: #12606b;
        }

        .atividade-dado span {
            font-size: 9px;

            color: #71878c;
        }

        .atividade-descricao {
            font-size: 11px;

            color: #536c71;

            margin-top: 10px;

            line-height: 1.4;
        }


        /* =========================================
           AÇÕES DO POST
        ========================================= */

        .actions {
            display: flex;

            gap: 18px;

            margin-top: 11px;

            font-size: 20px;
        }

        .actions span {
            cursor: pointer;

            transition: 0.2s;
        }

        .actions span:hover {
            transform: scale(1.15);
        }

        .curtidas {
            font-size: 11px;

            font-weight: 600;

            margin-top: 6px;

            color: #34555c;
        }


        /* =========================================
           SEM PUBLICAÇÕES
        ========================================= */

        .sem-posts {
            background: white;

            border-radius: 18px;

            border: 1px solid #d8e6e8;

            padding: 40px 20px;

            text-align: center;

            color: #71878c;
        }

        .sem-posts h2 {
            color: #123b43;

            font-size: 18px;

            margin-bottom: 8px;
        }

        .sem-posts p {
            font-size: 12px;
        }


        /* =========================================
           BARRA INFERIOR
        ========================================= */

        .navbar {
            position: absolute;

            left: 10px;
            right: 10px;
            bottom: 10px;

            height: 58px;

            background: rgba(255, 255, 255, 0.97);

            border-radius: 18px;

            border: 1px solid #d8e6e8;

            box-shadow:
                0 4px 15px rgba(0, 0, 0, 0.12);

            display: flex;

            align-items: center;

            justify-content: space-around;

            z-index: 100;
        }

        .nav-item {
            width: 48px;
            height: 48px;

            display: flex;

            align-items: center;
            justify-content: center;

            border-radius: 14px;

            text-decoration: none;

            color: #34555c;

            font-size: 22px;

            transition: 0.2s;

            cursor: pointer;
        }

        .nav-item:hover {
            background: #eef7f8;
        }

        .nav-item.active {
            color: #12606b;

            background: #eef7f8;
        }


        /* =========================================
           BOTÃO CRIAR
        ========================================= */

        .nav-criar {
            width: 42px;
            height: 42px;

            border-radius: 13px;

            background: #12606b;

            color: white;

            display: flex;

            align-items: center;
            justify-content: center;

            font-size: 23px;

            text-decoration: none;

            box-shadow:
                0 4px 10px rgba(18, 96, 107, 0.3);
        }


        /* =========================================
           PERFIL
        ========================================= */

        .perfil-mini {
            position: relative;
        }

        .perfil-mini img {
            width: 29px;
            height: 29px;

            border-radius: 50%;

            object-fit: cover;

            border: 2px solid #12606b;
        }


        /* =========================================
           CELULAR
        ========================================= */

        @media (max-width: 390px) {

            body {
                background: #eef7f8;
            }

            .app {
                width: 100vw;
                height: 100vh;

                border-radius: 0;

                box-shadow: none;
            }

        }

    </style>

</head>


<body>


    <!-- =========================================
         APLICATIVO
    ========================================= -->

    <div class="app">


        <!-- =====================================
             CONTEÚDO
        ====================================== -->

        <main class="conteudo">


            <!-- =================================
                 TOPO
            ================================== -->

            <div class="topo">

                <div class="logo">
                    Fit<span>Social</span>
                </div>

                <div class="topo-acoes">

                    <span>
                        ♡
                    </span>

                    <span
                        onclick="window.location.href='conversa.html'"
                    >
                        💬
                    </span>

                </div>

            </div>


            <!-- =================================
                 CABEÇALHO
            ================================== -->

            <div class="cabecalho">

                <h1>
                    Início
                </h1>

                <p>
                    Veja as últimas publicações da comunidade.
                </p>

            </div>


            <!-- =================================
                 FEED
            ================================== -->

            <div
                id="feed"
                class="feed"
            ></div>


        </main>


        <!-- =====================================
             BARRA DE NAVEGAÇÃO
        ====================================== -->

        <nav class="navbar">


            <!-- INÍCIO -->

            <a
                href="inicio.html"
                class="nav-item active"
                title="Início"
            >
                🏠
            </a>


            <!-- EXPLORAR -->

            <a
                href="explorar.html"
                class="nav-item"
                title="Explorar"
            >
                🔍
            </a>


            <!-- CRIAR -->

            <a
                href="criar.html"
                class="nav-criar"
                title="Criar"
            >
                +
            </a>


            <!-- MENSAGENS -->

            <a
                href="conversa.html"
                class="nav-item"
                title="Mensagens"
            >
                💬
            </a>


            <!-- PERFIL -->

            <a
                href="perfil.html"
                class="nav-item perfil-mini"
                title="Perfil"
            >

                <img
                    id="navPerfilFoto"
                    src=""
                    alt="Perfil"
                    style="display:none;"
                >

                <span
                    id="navPerfilIcon"
                >
                    👤
                </span>

            </a>


        </nav>


    </div>


    <!-- =========================================
         JAVASCRIPT
    ========================================= -->

    <script>


        /* =========================================
           USUÁRIO LOGADO
        ========================================= */

        const usuario =
            JSON.parse(
                sessionStorage.getItem("usuario")
            );


        if (usuario) {

            if (usuario.fotoPerfil) {

                const foto =
                    document.getElementById(
                        "navPerfilFoto"
                    );

                const icone =
                    document.getElementById(
                        "navPerfilIcon"
                    );

                foto.src =
                    usuario.fotoPerfil;

                foto.style.display =
                    "block";

                icone.style.display =
                    "none";

            }

        }


        /* =========================================
           POSTS
        ========================================= */

        const feed =
            document.getElementById(
                "feed"
            );


        const posts =
            JSON.parse(
                localStorage.getItem(
                    "fitSocialPosts"
                )
            ) || [];


        /* =========================================
           POSTS MAIS RECENTES PRIMEIRO
        ========================================= */

        posts.sort(
            (a, b) =>
                Number(b.id || 0) -
                Number(a.id || 0)
        );


        /* =========================================
           SEM POSTS
        ========================================= */

        if (posts.length === 0) {

            feed.innerHTML = `

                <div class="sem-posts">

                    <h2>
                        Ainda não há publicações
                    </h2>

                    <p>
                        Seja a primeira pessoa a
                        compartilhar um treino ou publicação!
                    </p>

                </div>

            `;

        }


        /* =========================================
           MOSTRAR POSTS
        ========================================= */

        posts.forEach(
            function(post) {


                const div =
                    document.createElement(
                        "div"
                    );


                div.className =
                    "post";


                const nome =
                    post.usuarioNome ||
                    "Usuário";


                const primeiraLetra =
                    nome
                        .charAt(0)
                        .toUpperCase();


                let avatarHTML = `
                    ${primeiraLetra}
                `;


                if (post.usuarioFoto) {

                    avatarHTML = `

                        <img
                            src="${post.usuarioFoto}"
                            alt="Foto de ${nome}"
                        >

                    `;

                }


                let conteudoPost =
                    "";


                /* =================================
                   PUBLICAÇÃO NORMAL
                ================================== */

                if (
                    post.tipo ===
                    "publicacao"
                ) {

                    conteudoPost = `

                        ${
                            post.texto
                            ? `

                                <div class="post-text">

                                    ${escaparHTML(
                                        post.texto
                                    )}

                                </div>

                            `
                            : ""
                        }


                        ${
                            post.imagem
                            ? `

                                <img
                                    class="post-imagem"

                                    src="${post.imagem}"

                                    alt="Publicação"
                                >

                            `
                            : ""
                        }


                        ${
                            post.localizacao
                            ? `

                                <div class="localizacao">

                                    📍
                                    ${escaparHTML(
                                        post.localizacao
                                    )}

                                </div>

                            `
                            : ""
                        }

                    `;

                }


                /* =================================
                   ATIVIDADE
                ================================== */

                else if (
                    post.tipo ===
                    "atividade"
                ) {

                    conteudoPost = `

                        <div class="atividade">


                            <div class="atividade-titulo">

                                🏃

                                ${escaparHTML(
                                    post.esporte ||
                                    "Atividade"
                                )}

                            </div>


                            <div class="atividade-dados">


                                <div
                                    class="atividade-dado"
                                >

                                    <strong>
                                        ${post.km || 0}
                                    </strong>

                                    <span>
                                        KM
                                    </span>

                                </div>


                                <div
                                    class="atividade-dado"
                                >

                                    <strong>
                                        ${post.tempo || "--:--"}
                                    </strong>

                                    <span>
                                        Tempo
                                    </span>

                                </div>


                                <div
                                    class="atividade-dado"
                                >

                                    <strong>
                                        ${post.esporte || "-"}
                                    </strong>

                                    <span>
                                        Esporte
                                    </span>

                                </div>


                            </div>


                            ${
                                post.descricao
                                ? `

                                    <div
                                        class="atividade-descricao"
                                    >

                                        ${escaparHTML(
                                            post.descricao
                                        )}

                                    </div>

                                `
                                : ""
                            }


                            ${
                                post.localizacao
                                ? `

                                    <div
                                        class="localizacao"
                                    >

                                        📍

                                        ${escaparHTML(
                                            post.localizacao
                                        )}

                                    </div>

                                `
                                : ""
                            }


                        </div>

                    `;

                }


                /* =================================
                   MONTAR POST
                ================================== */

                div.innerHTML = `

                    <div class="post-header">


                        <div class="avatar">

                            ${avatarHTML}

                        </div>


                        <div>

                            <div class="name">

                                ${escaparHTML(
                                    nome
                                )}

                            </div>


                            <div class="time">

                                ${post.data || ""}

                            </div>

                        </div>


                        <div class="seguir">

                            Seguir

                        </div>


                    </div>


                    ${conteudoPost}


                    <div class="actions">


                        <span
                            onclick="curtir(this)"
                        >
                            🤍
                        </span>


                        <span>
                            💬
                        </span>


                        <span>
                            🔗
                        </span>


                    </div>


                    <div class="curtidas">

                        0 curtidas

                    </div>

                `;


                feed.appendChild(
                    div
                );

            }
        );


        /* =========================================
           CURTIR
        ========================================= */

        function curtir(el) {


            if (
                el.innerText ===
                "🤍"
            ) {

                el.innerText =
                    "❤️";


                el.style.transform =
                    "scale(1.3)";


                setTimeout(
                    function() {

                        el.style.transform =
                            "scale(1)";

                    },
                    200
                );

            }


            else {

                el.innerText =
                    "🤍";

            }

        }


        /* =========================================
           SEGURANÇA DO TEXTO
        ========================================= */

        function escaparHTML(
            texto
        ) {

            const div =
                document.createElement(
                    "div"
                );


            div.textContent =
                texto;


            return div.innerHTML;

        }


    </script>


</body>

</html>
