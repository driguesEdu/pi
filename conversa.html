<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Mensagens - FitSocial</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background: #eef7f8;
            color: #123b43;
        }


        /* =========================
           MENU LATERAL
        ========================= */

        .sidebar {
            position: fixed;

            left: 0;
            top: 0;

            width: 230px;
            height: 100vh;

            background: #073f49;

            padding: 25px 15px;

            z-index: 10;
        }


        .logo-link {
            text-decoration: none;
            color: inherit;
        }

        .logo {
            color: white;

            text-align: center;

            font-size: 27px;

            font-weight: bold;

            margin-bottom: 35px;
        }


        .menu {
            display: flex;

            flex-direction: column;

            gap: 12px;
        }


        .menu-item {
            display: flex;

            align-items: center;

            gap: 14px;

            padding: 13px;

            text-decoration: none;

            color: white;

            border-radius: 12px;

            cursor: pointer;

            transition: 0.2s;

            font-size: 14px;
        }


        .menu-item:hover,
        .menu-item.active {
            background: #12606b;
        }


        .menu-icon {
            width: 27px;
            height: 27px;

            display: flex;

            align-items: center;
            justify-content: center;
        }


        .menu-icon img {
            width: 27px;
            height: 27px;

            object-fit: contain;
        }


        /* =========================
           CONTEÚDO
        ========================= */

        .conteudo {
            margin-left: 230px;

            min-height: 100vh;

            padding: 35px;
        }


        .container {
            max-width: 900px;

            margin: auto;
        }


        /* =========================
           CABEÇALHO
        ========================= */

        .cabecalho {
            margin-bottom: 25px;
        }


        .cabecalho h1 {
            font-size: 30px;

            color: #123b43;

            margin-bottom: 7px;
        }


        .cabecalho p {
            color: #71878c;

            font-size: 14px;
        }


        /* =========================
           CARD PRINCIPAL
        ========================= */

        .mensagens-card {
            background: white;

            border: 1px solid #d8e6e8;

            border-radius: 20px;

            min-height: 650px;

            box-shadow:
                0 4px 15px rgba(0, 0, 0, 0.05);

            overflow: hidden;
        }


        /* =========================
           TOPO
        ========================= */

        .topo-mensagens {
            display: flex;

            align-items: center;

            justify-content: space-between;

            padding: 20px 25px;

            border-bottom: 1px solid #e1ecee;
        }


        .topo-mensagens h2 {
            font-size: 21px;

            color: #123b43;
        }


        .nova-conversa-topo {
            width: 40px;
            height: 40px;

            border: none;

            border-radius: 12px;

            background: #12606b;

            color: white;

            font-size: 24px;

            cursor: pointer;

            transition: 0.2s;
        }


        .nova-conversa-topo:hover {
            transform: scale(1.05);

            background: #0e525c;
        }


        /* =========================
           BUSCA
        ========================= */

        .search-box {
            display: flex;

            align-items: center;

            gap: 10px;

            background: #eef7f8;

            margin: 20px 25px;

            padding: 12px 15px;

            border-radius: 12px;

            border: 1px solid #d8e6e8;
        }


        .search-icon {
            font-size: 18px;
        }


        .search-box input {
            border: none;

            outline: none;

            width: 100%;

            background: transparent;

            font-size: 14px;

            color: #123b43;
        }


        .search-box input::placeholder {
            color: #8a9da1;
        }


        /* =========================
           CONVERSAS
        ========================= */

        #listaConversas {
            padding: 0 25px 25px;
        }


        .conversa {
            display: flex;

            align-items: center;

            padding: 15px;

            border-radius: 14px;

            cursor: pointer;

            transition: 0.2s;

            margin-bottom: 8px;
        }


        .conversa:hover {
            background: #eef7f8;
        }


        .conversa-avatar {
            width: 48px;
            height: 48px;

            border-radius: 50%;

            background: #12606b;

            color: white;

            display: flex;

            align-items: center;
            justify-content: center;

            font-weight: bold;

            margin-right: 13px;
        }


        .conversa-info {
            flex: 1;
        }


        .conversa-nome {
            font-size: 14px;

            font-weight: bold;

            color: #123b43;

            margin-bottom: 4px;
        }


        .ultima-mensagem {
            font-size: 12px;

            color: #71878c;
        }


        .horario {
            font-size: 11px;

            color: #8a9da1;
        }


        /* =========================
           ESTADO VAZIO
        ========================= */

        .empty-state {
            min-height: 430px;

            display: flex;

            flex-direction: column;

            justify-content: center;

            align-items: center;

            text-align: center;

            padding: 30px;
        }


        .icon-large {
            width: 75px;
            height: 75px;

            border-radius: 50%;

            background: #eef7f8;

            display: flex;

            align-items: center;
            justify-content: center;

            font-size: 35px;

            margin-bottom: 18px;
        }


        .empty-state h3 {
            color: #123b43;

            font-size: 20px;

            margin-bottom: 8px;
        }


        .empty-state p {
            color: #71878c;

            font-size: 14px;

            margin-bottom: 20px;
        }


        .empty-state button {
            background: #12606b;

            color: white;

            border: none;

            padding: 12px 20px;

            border-radius: 12px;

            cursor: pointer;

            font-weight: 600;

            transition: 0.2s;
        }


        .empty-state button:hover {
            background: #0e525c;

            transform: translateY(-2px);
        }


        /* =========================
           RESPONSIVO
        ========================= */

        @media (max-width: 700px) {

            .sidebar {
                width: 70px;

                padding: 20px 8px;
            }


            .logo {
                font-size: 0;
            }


            .logo::after {
                content: "FS";

                font-size: 20px;
            }


            .menu-item {
                justify-content: center;
            }


            .menu-item span:last-child {
                display: none;
            }


            .conteudo {
                margin-left: 70px;

                padding: 20px 15px;
            }


            .mensagens-card {
                min-height: 600px;
            }

        }


    </style>

</head>


<body>


    <!-- =========================
         MENU LATERAL
    ========================= -->

    <aside class="sidebar">


        <a href="index.html" class="logo-link">
            <div class="logo">
                FitSocial
            </div>
        </a>


        <nav class="menu">


            <a
                href="index.html"
                class="menu-item"
            >

                <span class="menu-icon">

                    <img
                        src="img/inicio.png"
                        alt="Início"
                    >

                </span>

                <span>
                    Início
                </span>

            </a>


            <a
                href="explorar.html"
                class="menu-item"
            >

                <span class="menu-icon">

                    <img
                        src="img/explorar.png"
                        alt="Explorar"
                    >

                </span>

                <span>
                    Explorar
                </span>

            </a>


            <a
                href="criar.html"
                class="menu-item"
            >

                <span class="menu-icon">

                    <img
                        src="img/criar.png"
                        alt="Criar"
                    >

                </span>

                <span>
                    Criar
                </span>

            </a>


            <a
                href="mensagens.html"
                class="menu-item active"
            >

                <span class="menu-icon">

                    <img
                        src="img/mensagens.png"
                        alt="Mensagens"
                    >

                </span>

                <span>
                    Mensagens
                </span>

            </a>


            <a
                href="perfil.html"
                class="menu-item"
            >

                <span class="menu-icon">

                    <img
                        src="img/perfil.png"
                        alt="Perfil"
                    >

                </span>

                <span>
                    Perfil
                </span>

            </a>


        </nav>

    </aside>


    <!-- =========================
         CONTEÚDO
    ========================= -->

    <main class="conteudo">


        <div class="container">


            <div class="cabecalho">

                <h1>
                    Mensagens
                </h1>

                <p>
                    Converse com seus amigos e pessoas da comunidade.
                </p>

            </div>


            <div class="mensagens-card">


                <!-- TOPO -->

                <div class="topo-mensagens">

                    <h2>
                        Conversas
                    </h2>


                    <button
                        class="nova-conversa-topo"
                        onclick="novaConversa()"
                        title="Nova conversa"
                    >
                        +
                    </button>

                </div>


                <!-- BUSCA -->

                <div class="search-box">

                    <span class="search-icon">
                        🔍
                    </span>

                    <input
                        type="text"
                        id="campoBusca"
                        placeholder="Buscar conversas..."
                        onkeyup="buscarConversas()"
                    >

                </div>


                <!-- LISTA -->

                <div id="listaConversas">


                    <!--
                        Quando houver conversas,
                        elas aparecerão aqui.
                    -->


                </div>


                <!-- ESTADO VAZIO -->

                <div
                    class="empty-state"
                    id="estadoVazio"
                >

                    <div class="icon-large">
                        💬
                    </div>


                    <h3>
                        Nenhuma conversa
                    </h3>


                    <p>
                        Comece uma nova conversa com seus amigos!
                    </p>


                    <button
                        onclick="novaConversa()"
                    >
                        + &nbsp; Nova Conversa
                    </button>

                </div>


            </div>


        </div>


    </main>


    <!-- =========================
         JAVASCRIPT
    ========================= -->

    <script>


        // ==========================================
        // NAVEGAÇÃO
        // ==========================================

        function novaConversa() {

            alert(
                "A função de nova conversa será adicionada aqui."
            );

        }


        // ==========================================
        // BUSCAR CONVERSAS
        // ==========================================

        function buscarConversas() {

            const campo =
                document.getElementById(
                    "campoBusca"
                );


            const pesquisa =
                campo.value
                    .toLowerCase()
                    .trim();


            const conversas =
                document.querySelectorAll(
                    ".conversa"
                );


            conversas.forEach(
                function(conversa) {

                    const texto =
                        conversa.innerText
                            .toLowerCase();


                    if (
                        texto.includes(
                            pesquisa
                        )
                    ) {

                        conversa.style.display =
                            "flex";

                    }

                    else {

                        conversa.style.display =
                            "none";

                    }

                }
            );

        }


        // ==========================================
        // USUÁRIO LOGADO
        // ==========================================

        const usuario =
            JSON.parse(
                sessionStorage.getItem(
                    "usuario"
                )
            );


        // Aqui podemos futuramente
        // carregar as conversas do usuário.


    </script>


</body>

</html>
