<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Criar - FitSocial</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            background: #eef7f8;
            color: #123b43;
            min-height: 100vh;
        }

        .sidebar {
            position: fixed;
            left: 0;
            top: 0;
            width: 230px;
            height: 100vh;
            background: #073f49;
            padding: 25px 15px;
            z-index: 10;
        }

        .logo {
            color: white;
            text-align: center;
            font-size: 27px;
            font-weight: bold;
            margin-bottom: 35px;
        }

        .menu {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .menu a {
            text-decoration: none;
            color: white;
            display: flex;
            align-items: center;
            gap: 14px;
            padding: 13px;
            border-radius: 12px;
            transition: 0.2s;
        }

        .menu a:hover,
        .menu a.ativo {
            background: #12606b;
        }

        .menu img {
            width: 27px;
            height: 27px;
            object-fit: contain;
        }

        main {
            margin-left: 230px;
            padding: 35px;
            min-height: 100vh;
        }

        .container {
            max-width: 750px;
            margin: auto;
        }

        h1 {
            margin-bottom: 25px;
            font-size: 30px;
        }

        .card {
            background: white;
            border-radius: 20px;
            padding: 25px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.07);
        }

        .usuario {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 20px;
            font-weight: bold;
        }

        .avatar {
            width: 45px;
            height: 45px;
            border-radius: 50%;
            background: #12606b;
            object-fit: cover;
        }

        .tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 25px;
        }

        .tab {
            border: none;
            padding: 12px 20px;
            border-radius: 20px;
            background: #e3f0f2;
            color: #123b43;
            cursor: pointer;
            font-weight: bold;
        }

        .tab.ativo {
            background: #12606b;
            color: white;
        }

        .conteudo-aba {
            display: none;
        }

        .conteudo-aba.ativo {
            display: block;
        }

        textarea {
            width: 100%;
            min-height: 150px;
            resize: vertical;
            border: 1px solid #d3e1e3;
            border-radius: 15px;
            padding: 15px;
            font-size: 16px;
            outline: none;
        }

        textarea:focus,
        input:focus,
        select:focus {
            border-color: #12606b;
        }

        .preview {
            margin-top: 15px;
            display: none;
        }

        .preview img {
            width: 100%;
            max-height: 400px;
            object-fit: cover;
            border-radius: 15px;
        }

        .acoes {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-top: 20px;
        }

        .botao {
            border: none;
            padding: 12px 18px;
            border-radius: 12px;
            cursor: pointer;
            font-weight: bold;
            background: #e3f0f2;
            color: #123b43;
        }

        .botao:hover {
            opacity: 0.85;
        }

        .publicar {
            background: #12606b;
            color: white;
            width: 100%;
            margin-top: 20px;
            font-size: 17px;
        }

        .localizacao {
            margin-top: 12px;
            padding: 12px;
            background: #f0f7f8;
            border-radius: 12px;
            display: none;
            font-size: 14px;
        }

        input[type="file"] {
            display: none;
        }

        /* ATIVIDADE */

        .atividade-box {
            display: flex;
            flex-direction: column;
            gap: 18px;
        }

        .campo {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .campo label {
            font-weight: bold;
            font-size: 15px;
        }

        .campo input,
        .campo select {
            width: 100%;
            padding: 14px;
            border: 1px solid #d3e1e3;
            border-radius: 12px;
            font-size: 16px;
            outline: none;
            background: white;
            color: #123b43;
        }

        .campo-pequeno {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        #outroEsporte {
            display: none;
            margin-top: 8px;
        }

        .atividade-info {
            background: #f0f7f8;
            border-radius: 15px;
            padding: 15px;
            margin-bottom: 20px;
        }

        .atividade-info p {
            color: #5e777d;
            line-height: 1.5;
        }

        @media (max-width: 700px) {

            .sidebar {
                width: 75px;
                padding: 20px 8px;
            }

            .logo {
                font-size: 0;
            }

            .logo::after {
                content: "FS";
                font-size: 20px;
            }

            .menu a {
                justify-content: center;
            }

            .menu span {
                display: none;
            }

            main {
                margin-left: 75px;
                padding: 20px;
            }

            .campo-pequeno {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>

    <!-- MENU -->

    <aside class="sidebar">

        <a href="conversa.html" class="logo" style="display:block; text-decoration:none; cursor:pointer;">
            FitSocial
        </a>

        <nav class="menu">

            <a href="index.html">
                <img src="img/inicio.png">
                <span>Início</span>
            </a>

            <a href="explorar.html">
                <img src="img/explorar.png">
                <span>Explorar</span>
            </a>

            <a href="criar.html" class="ativo">
                <img src="img/criar.png">
                <span>Criar</span>
            </a>

            <a href="conversa.html">
                <img src="img/mensagens.png">
                <span>Mensagens</span>
            </a>

            <a href="perfil.html">
                <img src="img/perfil.png">
                <span>Perfil</span>
            </a>

        </nav>

    </aside>


    <!-- CONTEÚDO -->

    <main>

        <div class="container">

            <h1>Criar</h1>

            <div class="card">

                <!-- USUÁRIO -->

                <div class="usuario">

                    <img
                        id="avatarUsuario"
                        class="avatar"
                        src=""
                        alt="Foto do usuário"
                    >

                    <span id="nomeUsuario">
                        Usuário
                    </span>

                </div>


                <!-- ABAS -->

                <div class="tabs">

                    <button
                        type="button"
                        class="tab ativo"
                        onclick="abrirAba('publicacao', this)"
                    >
                        Publicação
                    </button>

                    <button
                        type="button"
                        class="tab"
                        onclick="abrirAba('atividade', this)"
                    >
                        Atividade
                    </button>

                </div>


                <!-- ================================= -->
                <!-- PUBLICAÇÃO -->
                <!-- ================================= -->

                <div
                    id="publicacao"
                    class="conteudo-aba ativo"
                >

                    <textarea
                        id="texto"
                        placeholder="Compartilhe seu treino, progresso ou alguma novidade..."
                    ></textarea>


                    <div
                        class="preview"
                        id="preview"
                    >

                        <img
                            id="imagemPreview"
                            alt="Pré-visualização"
                        >

                    </div>


                    <div class="acoes">

                        <label
                            for="imagem"
                            class="botao"
                        >
                            📷 Adicionar foto
                        </label>

                        <input
                            type="file"
                            id="imagem"
                            accept="image/*"
                        >


                        <button
                            type="button"
                            class="botao"
                            onclick="pegarLocalizacao()"
                        >
                            📍 Adicionar localização
                        </button>

                    </div>


                    <div
                        class="localizacao"
                        id="localizacao"
                    ></div>


                    <button
                        type="button"
                        class="botao publicar"
                        onclick="publicarPost()"
                    >
                        Publicar
                    </button>

                </div>


                <!-- ================================= -->
                <!-- ATIVIDADE -->
                <!-- ================================= -->

                <div
                    id="atividade"
                    class="conteudo-aba"
                >

                    <div class="atividade-info">

                        <p>
                            Registre sua atividade física e compartilhe
                            seus resultados com seus amigos.
                        </p>

                    </div>


                    <div class="atividade-box">


                        <!-- ESPORTE -->

                        <div class="campo">

                            <label for="esporte">
                                🏃 Tipo de esporte
                            </label>

                            <select
                                id="esporte"
                                onchange="verificarOutroEsporte()"
                            >

                                <option value="">
                                    Selecione um esporte
                                </option>

                                <option value="Corrida">
                                    Corrida
                                </option>

                                <option value="Caminhada">
                                    Caminhada
                                </option>

                                <option value="Ciclismo">
                                    Ciclismo
                                </option>

                                <option value="Musculação">
                                    Musculação
                                </option>

                                <option value="Natação">
                                    Natação
                                </option>

                                <option value="Futebol">
                                    Futebol
                                </option>

                                <option value="Basquete">
                                    Basquete
                                </option>

                                <option value="Vôlei">
                                    Vôlei
                                </option>

                                <option value="Tênis">
                                    Tênis
                                </option>

                                <option value="Crossfit">
                                    Crossfit
                                </option>

                                <option value="Yoga">
                                    Yoga
                                </option>

                                <option value="Pilates">
                                    Pilates
                                </option>

                                <option value="Lutas">
                                    Lutas
                                </option>

                                <option value="Skate">
                                    Skate
                                </option>

                                <option value="Patinação">
                                    Patinação
                                </option>

                                <option value="Dança">
                                    Dança
                                </option>

                                <option value="Outro">
                                    Outro
                                </option>

                            </select>


                            <input
                                type="text"
                                id="outroEsporte"
                                placeholder="Digite o nome do esporte..."
                            >

                        </div>


                        <!-- KM E TEMPO -->

                        <div class="campo-pequeno">


                            <div class="campo">

                                <label for="km">
                                    📏 Quilômetros
                                </label>

                                <input
                                    type="number"
                                    id="km"
                                    placeholder="Ex: 5"
                                    min="0"
                                    step="0.01"
                                >

                            </div>


                            <div class="campo">

                                <label for="tempo">
                                    ⏱️ Tempo de treino
                                </label>

                                <input
                                    type="time"
                                    id="tempo"
                                    value="00:30"
                                >

                            </div>

                        </div>


                        <!-- DESCRIÇÃO -->

                        <div class="campo">

                            <label for="descricaoAtividade">
                                📝 Observação
                            </label>

                            <textarea
                                id="descricaoAtividade"
                                placeholder="Conte como foi seu treino..."
                            ></textarea>

                        </div>


                        <button
                            type="button"
                            class="botao publicar"
                            onclick="publicarAtividade()"
                        >
                            Registrar atividade
                        </button>

                    </div>

                </div>

            </div>

        </div>

    </main>


<script>

    // ==========================================
    // VERIFICAR USUÁRIO
    // ==========================================

    const usuario =
        JSON.parse(
            sessionStorage.getItem("usuario")
        );


    if (!usuario) {

        alert(
            "Você precisa estar logado."
        );

        window.location.href =
            "login.html";

    }


    // ==========================================
    // MOSTRAR USUÁRIO
    // ==========================================

    if (usuario) {

        document.getElementById(
            "nomeUsuario"
        ).textContent =
            usuario.nome ||
            usuario.name ||
            "Usuário";


        document.getElementById(
            "avatarUsuario"
        ).src =
            usuario.fotoPerfil ||
            "https://via.placeholder.com/100";

    }


    // ==========================================
    // VARIÁVEIS
    // ==========================================

    let latitude = null;

    let longitude = null;

    let localizacaoTexto = "";


    // ==========================================
    // TROCAR ABA
    // ==========================================

    function abrirAba(nomeAba, botao) {

        document
            .querySelectorAll(".conteudo-aba")
            .forEach(function(aba) {

                aba.classList.remove("ativo");

            });


        document
            .querySelectorAll(".tab")
            .forEach(function(tab) {

                tab.classList.remove("ativo");

            });


        document
            .getElementById(nomeAba)
            .classList.add("ativo");


        botao.classList.add("ativo");

    }


    // ==========================================
    // MOSTRAR CAMPO "OUTRO ESPORTE"
    // ==========================================

    function verificarOutroEsporte() {

        const esporte =
            document.getElementById(
                "esporte"
            ).value;


        const outro =
            document.getElementById(
                "outroEsporte"
            );


        if (esporte === "Outro") {

            outro.style.display =
                "block";

            outro.focus();

        } else {

            outro.style.display =
                "none";

            outro.value = "";

        }

    }


    // ==========================================
    // PREVISUALIZAÇÃO DA FOTO
    // ==========================================

    document
        .getElementById("imagem")
        .addEventListener(
            "change",
            function(event) {

                const arquivo =
                    event.target.files[0];


                if (!arquivo) {
                    return;
                }


                if (
                    !arquivo.type.startsWith(
                        "image/"
                    )
                ) {

                    alert(
                        "Escolha uma imagem válida."
                    );

                    event.target.value = "";

                    return;

                }


                const leitor =
                    new FileReader();


                leitor.onload =
                    function(e) {

                        document
                            .getElementById(
                                "imagemPreview"
                            )
                            .src =
                            e.target.result;


                        document
                            .getElementById(
                                "preview"
                            )
                            .style.display =
                            "block";

                    };


                leitor.readAsDataURL(
                    arquivo
                );

            }
        );


    // ==========================================
    // LOCALIZAÇÃO
    // ==========================================

    function pegarLocalizacao() {

        const caixa =
            document.getElementById(
                "localizacao"
            );


        if (!navigator.geolocation) {

            alert(
                "Seu navegador não suporta localização."
            );

            return;

        }


        caixa.style.display =
            "block";


        caixa.textContent =
            "Obtendo sua localização...";


        navigator.geolocation.getCurrentPosition(

            function(posicao) {

                latitude =
                    posicao.coords.latitude;

                longitude =
                    posicao.coords.longitude;


                localizacaoTexto =
                    "Localização adicionada";


                caixa.textContent =
                    "📍 Localização adicionada à publicação";

            },


            function() {

                latitude = null;

                longitude = null;

                localizacaoTexto = "";


                caixa.textContent =
                    "Não foi possível obter sua localização.";


                alert(
                    "Não foi possível obter sua localização. Verifique a permissão do navegador."
                );

            },


            {
                enableHighAccuracy: true,
                timeout: 10000,
                maximumAge: 0
            }

        );

    }


    // ==========================================
    // COMPRIMIR IMAGEM
    // ==========================================

    function comprimirImagem(arquivo) {

        return new Promise(
            function(resolve, reject) {

                const leitor =
                    new FileReader();


                leitor.onload =
                    function(evento) {

                        const imagem =
                            new Image();


                        imagem.onload =
                            function() {

                                let largura =
                                    imagem.width;

                                let altura =
                                    imagem.height;


                                const maximo =
                                    1000;


                                if (
                                    largura > maximo ||
                                    altura > maximo
                                ) {

                                    if (
                                        largura > altura
                                    ) {

                                        altura =
                                            altura *
                                            (
                                                maximo /
                                                largura
                                            );

                                        largura =
                                            maximo;

                                    } else {

                                        largura =
                                            largura *
                                            (
                                                maximo /
                                                altura
                                            );

                                        altura =
                                            maximo;

                                    }

                                }


                                const canvas =
                                    document.createElement(
                                        "canvas"
                                    );


                                canvas.width =
                                    largura;

                                canvas.height =
                                    altura;


                                const contexto =
                                    canvas.getContext(
                                        "2d"
                                    );


                                contexto.drawImage(
                                    imagem,
                                    0,
                                    0,
                                    largura,
                                    altura
                                );


                                const resultado =
                                    canvas.toDataURL(
                                        "image/jpeg",
                                        0.70
                                    );


                                resolve(
                                    resultado
                                );

                            };


                        imagem.onerror =
                            reject;


                        imagem.src =
                            evento.target.result;

                    };


                leitor.onerror =
                    reject;


                leitor.readAsDataURL(
                    arquivo
                );

            }
        );

    }


    // ==========================================
    // PEGAR POSTS
    // ==========================================

    function pegarPosts() {

        let posts = [];

        const dados =
            localStorage.getItem(
                "fitSocialPosts"
            );


        if (dados) {

            try {

                posts =
                    JSON.parse(dados);

            } catch (erro) {

                posts = [];

            }

        }


        if (!Array.isArray(posts)) {

            posts = [];

        }


        return posts;

    }


    // ==========================================
    // SALVAR POST
    // ==========================================

    function salvarPost(post) {

        const posts =
            pegarPosts();


        posts.unshift(
            post
        );


        localStorage.setItem(
            "fitSocialPosts",
            JSON.stringify(posts)
        );

    }


    // ==========================================
    // PUBLICAÇÃO NORMAL
    // ==========================================

    async function publicarPost() {

        const texto =
            document
                .getElementById("texto")
                .value
                .trim();


        const arquivo =
            document
                .getElementById("imagem")
                .files[0];


        if (!texto && !arquivo) {

            alert(
                "Escreva alguma coisa ou adicione uma foto."
            );

            return;

        }


        const usuarioAtual =
            JSON.parse(
                sessionStorage.getItem(
                    "usuario"
                )
            );


        if (
            !usuarioAtual ||
            !usuarioAtual.email
        ) {

            alert(
                "Faça login novamente."
            );

            window.location.href =
                "login.html";

            return;

        }


        const botao =
            document.querySelector(
                "#publicacao .publicar"
            );


        botao.disabled =
            true;

        botao.textContent =
            "Publicando...";


        try {

            let imagemBase64 = "";


            if (arquivo) {

                imagemBase64 =
                    await comprimirImagem(
                        arquivo
                    );

            }


            const publicacao = {

                id:
                    Date.now(),

                tipo:
                    "publicacao",

                usuarioEmail:
                    usuarioAtual.email,

                usuarioNome:
                    usuarioAtual.nome ||
                    usuarioAtual.name ||
                    "Usuário",

                usuarioFoto:
                    usuarioAtual.fotoPerfil ||
                    "",

                texto:
                    texto,

                imagem:
                    imagemBase64,

                localizacao:
                    localizacaoTexto,

                latitude:
                    latitude,

                longitude:
                    longitude,

                data:
                    new Date()
                        .toLocaleString(
                            "pt-BR"
                        )

            };


            salvarPost(
                publicacao
            );


            alert(
                "Publicação criada com sucesso!"
            );


            window.location.href =
                "perfil.html";


        } catch (erro) {

            console.error(
                erro
            );


            alert(
                "Não foi possível salvar a publicação."
            );


            botao.disabled =
                false;

            botao.textContent =
                "Publicar";

        }

    }


    // ==========================================
    // PUBLICAR ATIVIDADE
    // ==========================================

    function publicarAtividade() {

        const esporteSelecionado =
            document.getElementById(
                "esporte"
            ).value;


        const outroEsporte =
            document.getElementById(
                "outroEsporte"
            ).value.trim();


        const km =
            document.getElementById(
                "km"
            ).value;


        const tempo =
            document.getElementById(
                "tempo"
            ).value;


        const descricao =
            document.getElementById(
                "descricaoAtividade"
            ).value.trim();


        // Verificar esporte

        if (!esporteSelecionado) {

            alert(
                "Escolha o tipo de esporte."
            );

            return;

        }


        let esporte =
            esporteSelecionado;


        if (
            esporteSelecionado === "Outro"
        ) {

            if (!outroEsporte) {

                alert(
                    "Digite o nome do esporte."
                );

                return;

            }


            esporte =
                outroEsporte;

        }


        // Verificar KM

        if (
            km === "" ||
            Number(km) < 0
        ) {

            alert(
                "Informe uma quantidade válida de quilômetros."
            );

            return;

        }


        // Verificar tempo

        if (!tempo) {

            alert(
                "Informe o tempo de treino."
            );

            return;

        }


        const usuarioAtual =
            JSON.parse(
                sessionStorage.getItem(
                    "usuario"
                )
            );


        if (
            !usuarioAtual ||
            !usuarioAtual.email
        ) {

            alert(
                "Faça login novamente."
            );

            window.location.href =
                "login.html";

            return;

        }


        // ==========================================
        // CRIAR ATIVIDADE
        // ==========================================

        const atividade = {

            id:
                Date.now(),

            tipo:
                "atividade",

            usuarioEmail:
                usuarioAtual.email,

            usuarioNome:
                usuarioAtual.nome ||
                usuarioAtual.name ||
                "Usuário",

            usuarioFoto:
                usuarioAtual.fotoPerfil ||
                "",

            esporte:
                esporte,

            km:
                Number(km),

            tempo:
                tempo,

            descricao:
                descricao,

            localizacao:
                localizacaoTexto,

            latitude:
                latitude,

            longitude:
                longitude,

            data:
                new Date()
                    .toLocaleString(
                        "pt-BR"
                    )

        };


        // Salvar

        try {

            salvarPost(
                atividade
            );


            alert(
                "Atividade registrada com sucesso!"
            );


            window.location.href =
                "perfil.html";


        } catch (erro) {
