<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login - FitSocial</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #0f3f58;

            display: flex;
            justify-content: center;
            align-items: center;

            height: 100vh;
        }

        .container {
            width: 850px;
            height: 520px;

            display: flex;

            background: white;

            border-radius: 10px;

            overflow: hidden;
        }


        /* =========================
           LADO ESQUERDO
        ========================= */

        .esquerda {
            width: 42%;

            background: #60bcee;

            position: relative;

            overflow: hidden;

            display: flex;

            align-items: center;
            justify-content: center;
        }

        .forma1 {
            position: absolute;

            width: 330px;
            height: 330px;

            background: #16587B;

            transform: rotate(45deg);

            left: -190px;
            top: 70px;
        }

        .forma2 {
            position: absolute;

            width: 280px;
            height: 280px;

            background: #3890c0;

            transform: rotate(45deg);

            left: -120px;
            top: -120px;
        }

        .forma3 {
            position: absolute;

            width: 250px;
            height: 250px;

            background: #16587B;

            transform: rotate(45deg);

            left: -130px;
            bottom: -130px;
        }

        .texto-esquerda {
            position: relative;

            z-index: 2;

            color: white;

            text-align: center;
        }

        .texto-esquerda h1 {
            font-size: 25px;

            margin-bottom: 10px;
        }

        .texto-esquerda p {
            font-size: 13px;
        }


        /* =========================
           LADO DIREITO
        ========================= */

        .direita {
            width: 58%;

            padding: 70px 55px;

            display: flex;

            flex-direction: column;

            align-items: center;
        }

        h2 {
            color: #16587B;

            font-size: 20px;

            margin: 0 0 35px;
        }

        .formulario {
            width: 100%;
        }


        /* =========================
           CAMPOS
        ========================= */

        .campo {
            display: flex;

            align-items: center;

            border-bottom: 1px solid #aaa;

            margin-bottom: 25px;
        }

        .campo span {
            color: #888;

            margin-right: 10px;

            font-size: 16px;
        }

        .campo input {
            width: 100%;

            border: none;

            outline: none;

            padding: 10px 0;

            font-size: 13px;
        }


        /* =========================
           ERRO
        ========================= */

        .erro {
            color: #d00000;

            font-size: 12px;

            margin-top: -10px;

            margin-bottom: 12px;

            min-height: 15px;
        }


        /* =========================
           BOTÃO
        ========================= */

        button {
            width: 100%;

            border: none;

            border-radius: 20px;

            padding: 11px;

            background: #16587B;

            color: white;

            font-weight: bold;

            cursor: pointer;

            margin-top: 5px;
        }

        button:hover {
            background: #0B405A;
        }


        /* =========================
           LINK
        ========================= */

        .voltar {
            margin-top: 18px;

            font-size: 12px;

            color: #16587B;

            text-decoration: none;
        }

        .voltar:hover {
            text-decoration: underline;
        }


        /* =========================
           RESPONSIVO
        ========================= */

        @media (max-width: 700px) {

            body {
                height: auto;

                min-height: 100vh;

                padding: 20px;
            }

            .container {
                width: 100%;

                height: auto;

                min-height: 520px;
            }

            .esquerda {
                display: none;
            }

            .direita {
                width: 100%;

                padding: 50px 30px;
            }

        }

    </style>

</head>


<body>


    <div class="container">


        <!-- =========================
             LADO ESQUERDO
        ========================= -->

        <div class="esquerda">

            <div class="forma1"></div>

            <div class="forma2"></div>

            <div class="forma3"></div>


            <div class="texto-esquerda">

                <h1>
                    FIT SOCIAL
                </h1>

                <p>
                    Entre na sua conta e continue sua jornada!
                </p>

            </div>

        </div>



        <!-- =========================
             LADO DIREITO
        ========================= -->

        <div class="direita">


            <h2>
                ENTRAR
            </h2>


            <div class="formulario">


                <!-- EMAIL -->

                <div class="campo">

                    <span>
                        ✉
                    </span>

                    <input
                        id="email"
                        type="email"
                        placeholder="E-mail"
                    >

                </div>



                <!-- SENHA -->

                <div class="campo">

                    <span>
                        🔒
                    </span>

                    <input
                        id="senha"
                        type="password"
                        placeholder="Senha"
                    >

                </div>



                <!-- ERRO -->

                <div
                    class="erro"
                    id="erro"
                ></div>



                <!-- BOTÃO -->

                <button onclick="login()">

                    ENTRAR

                </button>

            </div>



            <a
                href="cadastro.html"
                class="voltar"
            >
                Ainda não tenho uma conta
            </a>


        </div>

    </div>



    <script>

        function login() {

            const emailInput =
                document.getElementById("email");

            const senhaInput =
                document.getElementById("senha");

            const erro =
                document.getElementById("erro");


            const email =
                emailInput.value.trim().toLowerCase();

            const senha =
                senhaInput.value;


            erro.innerText = "";


            /* =========================
               VALIDAR CAMPOS
            ========================= */

            if (!email || !senha) {

                erro.innerText =
                    "Preencha todos os campos!";

                return;
            }


            /* =========================
               VALIDAR EMAIL
            ========================= */

            if (!email.includes("@")) {

                erro.innerText =
                    "O e-mail precisa ter o @!";

                return;
            }


            if (!email.includes(".")) {

                erro.innerText =
                    "O e-mail precisa ter um ponto (.)!";

                return;
            }


            /* =========================
               BUSCAR CONTAS SALVAS
            ========================= */

            let usuarios = [];


            try {

                usuarios = JSON.parse(
                    localStorage.getItem(
                        "fitSocialUsuarios"
                    )
                ) || [];

            } catch (erroJSON) {

                usuarios = [];

            }


            /* =========================
               VERIFICAR SE EXISTE CONTA
            ========================= */

            if (usuarios.length === 0) {

                erro.innerText =
                    "Nenhuma conta cadastrada!";

                return;
            }


            /* =========================
               PROCURAR USUÁRIO
            ========================= */

            const usuarioEncontrado =
                usuarios.find(function(usuario) {

                    return (
                        usuario.email === email &&
                        usuario.senha === senha
                    );

                });


            /* =========================
               LOGIN INCORRETO
            ========================= */

            if (!usuarioEncontrado) {

                erro.innerText =
                    "E-mail ou senha incorretos!";

                return;
            }


            /* =========================
               SALVAR USUÁRIO LOGADO
            ========================= */

            sessionStorage.setItem(
                "usuario",
                JSON.stringify(usuarioEncontrado)
            );


            /* =========================
               LOGIN REALIZADO
            ========================= */

            alert(
                "Login realizado com sucesso!"
            );


            window.location.href =
                "perfil.html";

        }


        /* =========================
           ENTER PARA ENTRAR
        ========================= */

        document.addEventListener(
            "keydown",
            function(event) {

                if (event.key === "Enter") {

                    login();

                }

            }
        );

    </script>

</body>

</html>
